services:
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    hostname: envoy
    ports:
      - "10000:10000"
    # environment:
    #   - loglevel=debug
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./target/wasm32-wasip1/release:/etc/envoy/proxy-wasm-plugins
    networks:
      - envoymesh
networks:
  envoymesh: {}
